name: VeriCred Midnight CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd contract && npm ci && cd ..
          cd api && npm ci && cd ..
          cd bboard-cli && npm ci && cd ..
          cd frontend && npm ci && cd ..

      - name: Install Compact Compiler
        run: |
          npm install -g @midnight-ntwrk/compact-cli || true

      - name: Compile Compact Contracts
        run: |
          cd contract && npm run compact

      - name: Typecheck TypeScript Codebases
        run: |
          cd contract && npm run typecheck
          cd api && npm run typecheck
          cd bboard-cli && npm run typecheck
          cd frontend && npm run typecheck

      - name: Execute Smart Contract Unit Tests
        run: |
          cd contract && npm run test

      - name: Build Production Packages
        run: |
          cd contract && npm run build
          cd api && npm run build
          cd bboard-cli && npm run build
          cd frontend && npm run build
