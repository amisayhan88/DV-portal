name: VeriCred Midnight CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root & Workspace Dependencies
        run: |
          npm install --no-audit
          cd contract && npm install --no-audit && cd ..
          cd api && npm install --no-audit && cd ..
          cd bboard-cli && npm install --no-audit && cd ..
          cd bboard-ui && npm install --no-audit && cd ..

      - name: Compile Compact Contracts
        run: |
          cd contract && npm run compact

      - name: Typecheck TypeScript Codebases
        run: |
          cd contract && npm run typecheck
          cd api && npm run typecheck
          cd bboard-cli && npm run typecheck
          cd bboard-ui && npm run typecheck

      - name: Execute Smart Contract Unit Tests
        run: |
          npm test

      - name: Build Production Packages
        run: |
          cd contract && npm run build
          cd api && npm run build
          cd bboard-cli && npm run build
          cd bboard-ui && npm run build
